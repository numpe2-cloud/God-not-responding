name: muj prvni workflow

on:
  push:
    branches:
      - master

jobs:
  testy:
    runs-on: ubuntu-latest

    steps:
      - name: Stahni kod
        uses: actions/checkout@v3

      - name: Nastav Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Instaluj zavislosti
        run: pip install -r requirements.txt

      - name: Spust testy
        run: pytest
